aiPromptPlaceholder=Zum Beispiel:\nErstelle eine moderne deutschsprachige Landingpage zum Thema Tierwelt und Artenschutz.\nErzeuge 5 logisch aufeinanderfolgende Blöcke:\n1. Einen großen Hero-Bereich mit einer emotionalen Überschrift über die Vielfalt der Tierwelt, einem kurzen Einführungstext, einem passenden Hintergrundbild und einer Schaltfläche „Tierwelt entdecken“.\n2. Einen Informationsbereich über bedrohte Tierarten mit drei kurzen Beispielen aus unterschiedlichen Lebensräumen.\n3. Einen Bereich über die Lebensräume Wald, Ozean und Savanne. Verwende passende Bilder und übersichtliche Texte.\n4. Einen Abschnitt mit konkreten Möglichkeiten, wie Besucher zum Tier- und Naturschutz beitragen können.\n5. Einen abschließenden Call-to-Action-Bereich mit der Überschrift „Gemeinsam Tiere schützen“ und einer Schaltfläche „Jetzt aktiv werden“.\n\nVerwende kurze, verständliche deutsche Texte, aussagekräftige Überschriften und ein harmonisches naturnahes Farbschema. Nutze geeignete Bilder ohne sichtbare Schrift, Logos oder Markenzeichen. Die Seite soll modern, emotional, übersichtlich und für Desktop sowie mobile Geräte geeignet sein.
